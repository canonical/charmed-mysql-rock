name: Release to GHCR

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 8.4/edge
  workflow_dispatch:

jobs:
  build:
    name: Build rock
    uses: canonical/data-platform-workflows/.github/workflows/build_rock.yaml@v48.1.1
    with:
      rockcraft-snap-channel: latest/edge
    permissions:
      actions: read
      contents: read

  release:
    name: Release rock
    needs:
      - build
    uses: canonical/data-platform-workflows/.github/workflows/release_rock_edge.yaml@v48.1.1
    with:
      artifact-prefix: ${{ needs.build.outputs.artifact-prefix }}
    permissions:
      actions: read    # Needed for GitHub API call to get workflow version
      packages: write  # Needed to publish to GitHub Container Registry
      contents: write  # Needed to create git tags

  trivy:
    name: Trivy Scan
    needs:
      - release
    uses: ./.github/workflows/trivy.yaml
    permissions:
      security-events: write  # Required for uploading Trivy SARIF results
